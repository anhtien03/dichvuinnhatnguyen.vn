name: Public UI regression
on:
  push:
    branches: [feature/seo-foundation-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Capture layout baseline
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/ui-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/ui-preview.log
          if [ "$ready" != 1 ]; then echo "::error::Vite preview failed to start on port 4173"; exit 1; fi
          mkdir -p ui-baseline
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch();
          const results = [];
          try {
            for (const [width,height] of [[1920,1080],[1366,768],[768,1024],[390,844],[360,800]]) {
              const page = await browser.newPage({viewport:{width,height}, reducedMotion:'reduce'});
              const category={id:1,slug:'fixture-category',name:'Danh mục kiểm thử',is_active:true};
              const product={id:1,slug:'fixture-product',name:'Ấn phẩm kiểm thử',category_id:1,category,is_active:true,base_price:1000,min_quantity:100,unit:'cái',image:'/logo.png',description:'Mô tả kiểm thử',specs:{quantities:[{count:100,label:'100',pricePerUnit:1000}],sizes:[],materials:[],finishings:[]}};
              const post={id:1,slug:'fixture-post',title:'Bài viết kiểm thử',excerpt:'Mô tả bài viết',content:'<p>Nội dung kiểm thử</p>',is_published:true,published_at:'2026-01-01T00:00:00Z'};
              await page.route('**/api/**', route => {
                const path=new URL(route.request().url()).pathname;
                const data=path.endsWith('/products/fixture-product')?product:path.endsWith('/categories/fixture-category')?category:path.endsWith('/posts/fixture-post')?post:path.endsWith('/products')?[product]:path.endsWith('/categories')?[category]:path.endsWith('/posts')?[post]:path.endsWith('/settings')?{}:[];
                return route.fulfill({json:{data}});
              });
              for (const [name,path] of [['home','/'],['catalog','/san-pham'],['category','/danh-muc/fixture-category'],['product','/san-pham/fixture-product'],['post','/tin-tuc/fixture-post'],['news','/tin-tuc'],['quote','/yeu-cau-bao-gia'],['about','/gioi-thieu'],['contact','/lien-he'],['login','/he-thong-admin/login']]) {
                const errors=[];
                const handler=e=>errors.push(e.message);
                page.on('pageerror',handler);
                await page.goto('http://127.0.0.1:4173'+path);
                await page.waitForTimeout(800);
                if(name==='product') await page.locator('#calculator-section').waitFor({timeout:10000});
                if(name==='post') await page.getByRole('heading',{name:post.title,exact:true}).waitFor({timeout:10000});
                await page.screenshot({path:'ui-baseline/'+name+'-'+width+'.png',fullPage:true,animations:'disabled'});
                const metrics=await page.evaluate(()=>({width:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,app:!!document.querySelector('#app')?.children.length,h1:[...document.querySelectorAll('main h1')].map(e=>e.textContent.trim()),canonical:document.querySelector('link[rel=canonical]')?.href,robots:document.querySelector('meta[name=robots]')?.content,title:document.title}));
                if(['home','catalog','category','product','post'].includes(name)&&metrics.h1.length!==1) errors.push('Expected one main H1: '+JSON.stringify(metrics.h1));
                if(name!=='login'&&metrics.canonical!=='https://dichvuinnhatnguyen.vn'+path) errors.push('Canonical mismatch: '+metrics.canonical);
                if(name==='login'&&!metrics.robots?.includes('noindex')) errors.push('Admin must be noindex');
                results.push({name,width,height,...metrics,errors});
                page.off('pageerror',handler);
              }
              await page.close();
            }
          } finally {
            await browser.close();
            await writeFile('ui-baseline/results.json',JSON.stringify(results,null,2));
          }
          if(results.some(r=>!r.app||r.scrollWidth>r.width+1||r.errors.length)) process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-baseline
          path: ui-baseline/
  seo-browser-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, simplexml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - name: Run integrated HTTP SEO diagnostic
        run: bash scripts/seo-integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-browser-results
          path: seo-browser-results.json
  seo-database-diagnostic:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, simplexml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php -r 'file_put_contents(".env", "APP_ENV=testing\nAPP_KEY=base64:".base64_encode(random_bytes(32))."\n");'
      - run: php artisan test --filter=PublicSeoDiagnosticTest
  visual-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        width: [1920, 1366, 768, 390, 360]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build pinned baseline and candidate
        run: |
          revision=$(node -p "require('./tests/visual-baseline.json').revision")
          git fetch --depth=1 origin "$revision"
          git worktree add --detach /tmp/ui-reference "$revision"
          (cd /tmp/ui-reference && npm ci && npm run build)
          npm ci
          npm run build
          npm install --no-save --package-lock=false playwright@1.51.1 pixelmatch@6.0.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Compare screenshots
        run: |
          (cd /tmp/ui-reference && npm run preview -- --host 127.0.0.1 --port 4174 --strictPort) > /tmp/reference.log 2>&1 &
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/candidate.log 2>&1 &
          for port in 4173 4174; do
            for i in $(seq 1 30); do curl -fs http://127.0.0.1:$port/ >/dev/null && break; sleep 1; done
            curl -fs http://127.0.0.1:$port/ >/dev/null || { cat /tmp/reference.log /tmp/candidate.log; exit 1; }
          done
          mkdir -p visual-results
          status=0
          UI_BASE_URL=http://127.0.0.1:4174 UI_OUTPUT=visual-results/reference UI_WIDTH=${{ matrix.width }} timeout --kill-after=10s 180s node tests/visual-capture.mjs || status=1
          UI_BASE_URL=http://127.0.0.1:4174 UI_OUTPUT=visual-results/repeat UI_WIDTH=${{ matrix.width }} timeout --kill-after=10s 180s node tests/visual-capture.mjs || status=1
          UI_BASE_URL=http://127.0.0.1:4173 UI_OUTPUT=visual-results/candidate UI_WIDTH=${{ matrix.width }} timeout --kill-after=10s 180s node tests/visual-capture.mjs || status=1
          node --input-type=module <<'JS' || status=1
          import {readFileSync,writeFileSync,readdirSync,mkdirSync} from 'node:fs';
          import {PNG} from 'pngjs';
          import pixelmatch from 'pixelmatch';
          const root='visual-results', results=[];
          mkdirSync(root+'/diff',{recursive:true});
          const files=readdirSync(root+'/reference').filter(f=>f.endsWith('.png'));
          for(const target of ['repeat','candidate']) for(const file of files){
            try{
              const a=PNG.sync.read(readFileSync(root+'/reference/'+file));
              const b=PNG.sync.read(readFileSync(root+'/'+target+'/'+file));
              if(a.width!==b.width||a.height!==b.height){results.push({target,file,ok:false,reason:'dimension mismatch',reference:[a.width,a.height],candidate:[b.width,b.height]});continue;}
              const diff=new PNG({width:a.width,height:a.height});
              const pixels=pixelmatch(a.data,b.data,diff.data,a.width,a.height,{threshold:0.1,includeAA:false});
              const ratio=pixels/(a.width*a.height);
              results.push({target,file,pixels,ratio,ok:ratio<=0.001});
              if(pixels)writeFileSync(root+'/diff/'+target+'-'+file,PNG.sync.write(diff));
            }catch(e){results.push({target,file,ok:false,reason:e.message})}
          }
          writeFileSync(root+'/comparison.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          if(files.length!==10||readdirSync(root+'/repeat').filter(f=>f.endsWith('.png')).length!==10||readdirSync(root+'/candidate').filter(f=>f.endsWith('.png')).length!==10||results.some(r=>!r.ok))process.exitCode=1;
          JS
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-comparison-${{ matrix.width }}
          path: visual-results/
