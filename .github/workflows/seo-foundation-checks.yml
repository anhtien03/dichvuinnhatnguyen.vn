name: SEO foundation checks
on:
  push:
    branches: [feature/seo-foundation-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/api-client.test.mjs tests/pricing-regression.test.mjs
      - name: Frontend build
        if: ${{ !cancelled() }}
        run: npm run build
  backend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: find backend/app backend/routes backend/config -name '*.php' -print0 | xargs -0 -n1 php -l
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php -r 'file_put_contents(".env", "APP_ENV=testing\nAPP_KEY=base64:".base64_encode(random_bytes(32))."\n");'
      - run: php artisan test --filter=CatalogSecurityTest
      - name: RBAC regression checks
        if: ${{ !cancelled() }}
        run: |
          php artisan test --filter='PermissionSecurityTest::test_(guest|staff|inactive|explicit)'
      - name: Pricing route and SEO authorization (required)
        if: ${{ !cancelled() }}
        run: |
          php artisan test --filter='PermissionSecurityTest::test_(pricing|seo)'
      - name: Privilege escalation regression (required)
        if: ${{ !cancelled() }}
        run: |
          php artisan test --filter='AdvancedPermissionSecurityTest::test_(self_promotion_is_denied|root_edit_is_denied|grant_unheld_permission_is_denied|last_root_cannot_be_demoted|toggle_lock_revokes_tokens)$'
      - name: Permission and token revocation regression (required)
        if: ${{ !cancelled() }}
        run: |
          php artisan test --filter='AdvancedPermissionSecurityTest::test_(string_false|update_lock|password_change)'
      - name: Pricing permission regression (required)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=PricingPermissionTest
      - name: Dashboard and hidden content regression (required)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=DashboardContentSecurityTest
      - name: Dashboard quote regression (required)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=test_dashboard_does_not_disclose_quotes_to_staff
      - name: Quote file security regression (required)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=QuoteFileSecurityTest
      - name: Authentication security regression (required)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=AuthenticationSecurityTest
      - name: ERP financial regression (required)
        if: ${{ !cancelled() }}
        run: php artisan test --filter='ErpIntegrityTest::test_(financial_formula_and_sequential_payments|invalid_item_update_does_not_mutate_order|payment_failure_rolls_back|payment_permission_is_independent)$'
      - name: ERP integrity regression (required)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=ErpIntegrityTest::test_target_
      - name: ERP concurrency and replay contracts (required diagnostic gate)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=ErpIntegrityTest::test_concurrency_
  erp-mysql-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: erp_ci_only
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_ci_only
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php -r 'file_put_contents(".env", "APP_ENV=testing\nAPP_KEY=base64:".base64_encode(random_bytes(32))."\n");'
      - name: Parallel ERP service contracts (required)
        run: php tests/erp-parallel.php

  migration-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php -r 'file_put_contents(".env", "APP_ENV=testing\nAPP_KEY=base64:".base64_encode(random_bytes(32))."\n");'
      - name: Full migration and database constraints
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $app=require 'bootstrap/app.php';
          $kernel=$app->make(Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();
          if (!app()->environment('testing') || config('database.default')!=='sqlite' || config('database.connections.sqlite.database')!==':memory:') exit(2);
          $status=$kernel->call('migrate',['--force'=>true]);
          echo $kernel->output();
          if ($status!==0) exit($status);
          $failed=false;
          foreach (['erp_orders','erp_cashbook_entries'] as $table) {
              $ok=collect(Illuminate\Support\Facades\Schema::getIndexes($table))->contains(fn($i)=>$i['unique'] && $i['columns']===['code']);
              echo "$table unique code: ".($ok?'PASS':'FAIL').PHP_EOL;
              $failed=$failed||!$ok;
          }
          foreach (['erp_order_items','erp_order_payments','erp_cashbook_entries'] as $table) {
              $ok=collect(Illuminate\Support\Facades\Schema::getForeignKeys($table))->contains(fn($i)=>$i['columns']===['order_id'] && $i['foreign_table']==='erp_orders');
              echo "$table order FK: ".($ok?'PASS':'FAIL').PHP_EOL;
              $failed=$failed||!$ok;
          }
          exit($failed?1:0);
          PHP

  seo-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Robots and static sitemap contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          robots=Path('public/robots.txt').read_text()
          origin='https://dichvuinnhatnguyen.vn'
          checks={}
          for path in ['/admin','/he-thong-admin','/he-thong-nn','/api/']:
              checks['robots blocks '+path]='Disallow: '+path in robots.splitlines()
          checks['canonical sitemap declaration']='Sitemap: '+origin+'/sitemap.xml' in robots.splitlines()
          root=ET.parse('public/sitemap.xml').getroot()
          urls=[e.text for e in root.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          checks['static sitemap nonempty']=bool(urls)
          checks['static sitemap unique']=len(urls)==len(set(urls))
          checks['static sitemap canonical origin']=all(u and u.startswith(origin+'/') for u in urls)
          checks['static sitemap excludes private paths']=all(not u.startswith(tuple(origin+p for p in ['/admin','/he-thong','/api/'])) for u in urls if u)
          for name,ok in checks.items(): print(('PASS ' if ok else 'FAIL ')+name)
          assert all(checks.values())
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, simplexml
          coverage: none
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - name: Raw HTML SEO diagnostic over Laravel HTTP
        run: SEO_RAW_ONLY=1 bash scripts/seo-integration.sh
