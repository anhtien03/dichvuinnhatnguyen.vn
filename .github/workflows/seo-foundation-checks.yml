name: SEO foundation checks
on:
  push:
    branches: [feature/seo-foundation-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/api-client.test.mjs tests/pricing-regression.test.mjs
      - run: npm run build
  backend-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: find backend/app backend/routes backend/config -name '*.php' -print0 | xargs -0 -n1 php -l
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php -r 'file_put_contents(".env", "APP_ENV=testing\nAPP_KEY=base64:".base64_encode(random_bytes(32))."\n");'
      - run: php artisan test --filter=CatalogSecurityTest
      - name: RBAC regression checks
        run: |
          php artisan test --filter='PermissionSecurityTest::test_(guest|staff|inactive|explicit)'
      - name: Pricing route and SEO authorization (required)
        run: |
          php artisan test --filter='PermissionSecurityTest::test_(pricing|seo)'
      - name: Privilege escalation regression (required)
        run: |
          php artisan test --filter='AdvancedPermissionSecurityTest::test_(self_promotion_is_denied|root_edit_is_denied|grant_unheld_permission_is_denied|last_root_cannot_be_demoted|toggle_lock_revokes_tokens)$'
      - name: Permission and token revocation regression (required)
        run: |
          php artisan test --filter='AdvancedPermissionSecurityTest::test_(string_false|update_lock|password_change)'
      - name: Pricing permission regression (required)
        run: php artisan test --filter=PricingPermissionTest
      - name: Dashboard and hidden content regression (required)
        run: php artisan test --filter=DashboardContentSecurityTest
      - name: Dashboard quote regression (required)
        run: php artisan test --filter=test_dashboard_does_not_disclose_quotes_to_staff
      - name: Quote file security regression (required)
        run: php artisan test --filter=QuoteFileSecurityTest
      - name: Authentication security regression (required)
        run: php artisan test --filter=AuthenticationSecurityTest
      - name: ERP financial regression (required)
        run: php artisan test --filter='ErpIntegrityTest::test_(financial_formula_and_sequential_payments|invalid_item_update_does_not_mutate_order|payment_failure_rolls_back|payment_permission_is_independent)$'
      - name: ERP integrity regression (required)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=ErpIntegrityTest::test_target_
      - name: ERP concurrency and replay contracts (required diagnostic gate)
        if: ${{ !cancelled() }}
        run: php artisan test --filter=ErpIntegrityTest::test_concurrency_
  erp-mysql-parallel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: erp_ci_only
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: erp_ci_only
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php -r 'file_put_contents(".env", "APP_ENV=testing\nAPP_KEY=base64:".base64_encode(random_bytes(32))."\n");'
      - name: Parallel ERP service contracts (required)
        run: php tests/erp-parallel.php
